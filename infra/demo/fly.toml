# fly.io config for the public Odin demo instance.
#
# Deploy:
#     flyctl launch --copy-config --name odin-demo --no-deploy
#     flyctl secrets set \
#         ODIN_LLM_API_KEY=... \
#         ODIN_DEMO_ENABLED=true \
#         ODIN_ENVIRONMENT=production
#     flyctl deploy

app = "odin-demo"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = 10

[build]
  dockerfile = "../../backend/Dockerfile"

[env]
  ODIN_DEMO_ENABLED = "true"
  ODIN_ENVIRONMENT = "production"
  ODIN_LOG_LEVEL = "INFO"
  # Demo instance is a showcase — disable the expensive paths.
  ODIN_DATAFLOW_ENABLED = "true"
  ODIN_GRAPH_RAG_ENABLED = "false"
  ODIN_VECTOR_STORE_ENABLED = "false"
  ODIN_MAX_FINDINGS = "10"
  ODIN_CORS_ORIGINS = '["https://odin.dev", "https://demo.odin.dev"]'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0      # scale-to-zero when idle to stay free-tier
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Demo needs Redis for rate limiting. Attach an Upstash Redis addon:
#     flyctl redis create --name odin-demo-cache --plan free
#     flyctl redis attach odin-demo-cache
# which populates REDIS_URL; map it to ODIN_REDIS_URL below.
[deploy]
  release_command = "python -c 'import app.main'"  # fail fast on import errors
